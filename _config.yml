title: Atelier Sauvage

collections:
  events:
    output: false
description: Objets vintage, design et galerie à Verviers
url: "https://ateliersauvageheusy.be"
baseurl: ""

# Meta (Facebook) Pixel — loaded only after cookie consent (assets/js/cookie-consent.js).
meta_pixel_id: "1719009352576992"

# Seasonal announcement banner on the homepage. When true, shows the holiday
# banner (index.holiday translations) and hides Thursday from the opening hours.
# Set to false to remove it after the summer schedule ends.
holiday_banner: false

plugins:
  - jekyll-polyglot

languages: ["fr", "en", "nl", "de"]
default_lang: "fr"
exclude_from_localization: ["assets", "functions", "robots.txt", "sitemap.xml", "scripts"]
parallel_localization: true
disable_disk_cache: true
lang_from_path: true

# Jekyll skips underscore-prefixed files; Cloudflare Pages reads this one.
include:
  - _headers

# Tell Jekyll to exclude these from the final build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - tailwindcss
  - tailwind.config.js
  - input.css
  - README.md
  # Automation source and internal notes. Jekyll copies unknown top-level
  # directories into _site, which published scripts/*.py on the live site.
  # functions/ is deliberately absent from this list: Cloudflare Pages needs it
  # at the deploy root, and compiles it rather than serving the source.
  - scripts
  - workers
  - docs
  - TODO.md
  # Shop: Functions config, shared Function code, ledger migrations and tests.
  - wrangler.toml
  - shop
  - migrations
  - tests
  - .wrangler
  - .dev.vars