  cgv:
    page_title: "Algemene verkoopsvoorwaarden – Atelier Sauvage"
    page_description: "Algemene voorwaarden voor online verkoop bij Atelier Sauvage: bestelling, betaling, levering, herroepingsrecht."
    heading: "Algemene verkoopsvoorwaarden"
    updated: "Versie van 2 september 2026"
    intro: "Deze voorwaarden gelden voor elke verkoop op afstand via ateliersauvageheusy.be. Door een bestelling te plaatsen verklaart de koper ze gelezen en aanvaard te hebben. Bij verschil geldt de Franse versie."
    sections:
      - title: "1. Verkoper"
        paragraphs:
          - "HAMAPA SRL, handelsnaam « Atelier Sauvage », Chaussée de Theux 59, 4802 Heusy (Verviers), België — KBO/btw BE 1000.380.596 — ateliersauvageheusy@gmail.com — +32 495 29 22 25."
      - title: "2. Toepassingsgebied"
        paragraphs:
          - "Deze voorwaarden gelden voor de onlineverkoop van tweedehands objecten, vintage meubelen en decoratie die op de site worden aangeboden aan consumenten die in België wonen."
          - "Elk object is uniek. De voorraad bedraagt dus één stuk per referentie en een object kan maar één keer verkocht worden."
      - title: "3. Objecten, beschrijvingen en staat"
        paragraphs:
          - "De verkochte objecten zijn tweedehands. Ze vertonen gebruikssporen, patina en onregelmatigheden die bij hun leeftijd en geschiedenis horen; dat zijn geen gebreken."
          - "Beschrijvingen, foto's, afmetingen en aanduidingen van de staat worden met de grootste zorg opgesteld, maar blijven indicatief. Vragen zijn welkom vóór de aankoop, per e-mail, telefoon of WhatsApp."
      - title: "4. Prijzen"
        paragraphs:
          - "De prijzen zijn in euro, inclusief alle taksen. De leveringskosten zijn niet in de prijs van de objecten begrepen; ze worden vóór de betaling getoond en aanvaard."
          - "Het toepasselijke btw-stelsel (margeregeling voor tweedehandsgoederen, indien van toepassing) wordt op de factuur vermeld. De verkoper mag zijn prijzen op elk moment wijzigen; objecten worden gefactureerd tegen de prijs die geldt op het moment van de bestelling."
      - title: "5. Bestelling en betaling"
        paragraphs:
          - "Bestellen gebeurt via het winkelmandje van de site. Tijdens de betaalprocedure worden de objecten in het mandje ongeveer 30 minuten voor de koper gereserveerd; daarna worden ze zonder betaling opnieuw beschikbaar."
          - "De betaling gebeurt online en beveiligd via het platform Stripe (Bancontact, krediet- en debetkaarten). De verkoper heeft nooit toegang tot de bankgegevens van de koper."
          - "De overeenkomst komt tot stand bij ontvangst van de betaling. Een orderbevestiging wordt per e-mail verstuurd. Blijkt een object ondanks de controles toch niet beschikbaar, dan wordt de koper verwittigd en binnen 14 dagen volledig terugbetaald."
      - title: "6. Levering en afhaling"
        paragraphs:
          - "Levering wordt enkel in België aangeboden, door een transporteur gespecialiseerd in kunst en meubelen. De kosten hangen af van de omvang van de objecten en worden voor de hele bestelling berekend."
          - "De koper kan de bestelling ook gratis afhalen in het atelier, op afspraak, tijdens de openingsuren."
          - "Na de betaling neemt de verkoper contact op met de koper om de modaliteiten en de datum van levering of afhaling af te spreken. De indicatieve leveringstermijn bedraagt 5 tot 15 werkdagen na dat contact."
          - "Het risico van verlies of beschadiging gaat over op de koper op het moment dat hij, of een door hem aangewezen derde, het object fysiek in bezit neemt. De koper controleert het object bij ontvangst en meldt transportschade binnen 48 uur, met foto's."
      - title: "7. Herroepingsrecht"
        paragraphs:
          - "Overeenkomstig Boek VI van het Wetboek van economisch recht beschikt de consument over een termijn van 14 kalenderdagen, te rekenen vanaf de dag waarop hij, of een door hem aangewezen derde, het object fysiek in bezit neemt, om de overeenkomst zonder opgave van redenen te herroepen."
          - "Om dit recht uit te oefenen brengt de koper de verkoper op de hoogte via een ondubbelzinnige verklaring (e-mail naar ateliersauvageheusy@gmail.com of brief), bijvoorbeeld met het onderstaande formulier."
          - "De koper stuurt of brengt het object zonder onnodige vertraging en uiterlijk 14 dagen na de kennisgeving terug. De directe kosten van het terugzenden zijn voor rekening van de koper. Voor objecten die door hun aard niet per post kunnen worden teruggezonden, zijn dat de kosten van een gespecialiseerde transporteur; ze worden geraamd op het bedrag van de leveringskosten van de bestelling."
          - "De verkoper betaalt alle ontvangen betalingen terug, inclusief de oorspronkelijke leveringskosten (met uitzondering van extra kosten door een andere leveringswijze dan de goedkoopste aangeboden), uiterlijk 14 dagen nadat hij van de herroeping op de hoogte is gebracht. De terugbetaling kan worden uitgesteld tot het object is terugontvangen of een bewijs van verzending is geleverd."
          - "De koper is aansprakelijk voor de waardevermindering van het object die het gevolg is van een behandeling die verder gaat dan nodig om de aard, de kenmerken en de werking ervan vast te stellen."
      - title: "8. Wettelijke garantie"
        paragraphs:
          - "Tweedehands objecten vallen onder de wettelijke garantie van conformiteit uit het Burgerlijk Wetboek. Zoals de wet toelaat, bedraagt deze garantie voor tweedehandsgoederen één jaar vanaf de levering."
          - "Niet gedekt zijn de gebreken en gebruikssporen die in de beschrijving vermeld of op de foto's zichtbaar zijn, normale slijtage, en schade door onaangepast gebruik, onderhoud of bewaring."
      - title: "9. Aansprakelijkheid"
        paragraphs:
          - "De verkoper is niet aansprakelijk voor de niet- of laattijdige uitvoering van zijn verplichtingen in geval van overmacht, noch voor onrechtstreekse schade. De aansprakelijkheid van de verkoper is in elk geval beperkt tot het bedrag van de bestelling."
      - title: "10. Persoonsgegevens"
        paragraphs:
          - "De gegevens die bij de bestelling worden verzameld (identiteit, contactgegevens, leveringsadres) worden uitsluitend gebruikt voor de verwerking van de bestelling, de levering en de wettelijke verplichtingen van de verkoper. Ze worden, voor zover nodig, doorgegeven aan de betaaldienst (Stripe), de e-maildienst (Resend) en de transporteur. Zie ook onze wettelijke vermeldingen."
      - title: "11. Toepasselijk recht en geschillen"
        paragraphs:
          - "Op deze voorwaarden is het Belgische recht van toepassing. Bij een geschil zoeken de partijen eerst een minnelijke oplossing. De consument kan zich wenden tot de Consumentenombudsdienst (consumentenombudsdienst.be) of tot het Europese platform voor onlinegeschillenbeslechting (ec.europa.eu/consumers/odr). Zo niet zijn de rechtbanken van het arrondissement Luik, afdeling Verviers, bevoegd, onverminderd de dwingende bevoegdheidsregels."
    form_title: "Modelformulier voor herroeping"
