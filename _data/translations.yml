  cgv:
    page_title: "Conditions générales de vente – Atelier Sauvage"
    page_description: "Conditions générales de vente en ligne de l'Atelier Sauvage : commande, paiement, livraison, droit de rétractation."
    heading: "Conditions générales de vente"
    updated: "Version du 2 septembre 2026"
    intro: "Les présentes conditions régissent toute vente conclue à distance via le site ateliersauvageheusy.be. En validant une commande, l'acheteur déclare les avoir lues et acceptées."
    sections:
      - title: "1. Vendeur"
        paragraphs:
          - "HAMAPA SRL, enseigne « Atelier Sauvage », Chaussée de Theux 59, 4802 Heusy (Verviers), Belgique — BCE/TVA BE 1000.380.596 — ateliersauvageheusy@gmail.com — +32 495 29 22 25."
      - title: "2. Objet"
        paragraphs:
          - "Les présentes conditions s'appliquent à la vente en ligne d'objets d'occasion, de mobilier vintage et de pièces de décoration proposés sur le site, à des consommateurs résidant en Belgique."
          - "Chaque objet est une pièce unique. Le stock est donc d'une unité par référence, et un objet ne peut être vendu qu'une seule fois."
      - title: "3. Objets, descriptions et état"
        paragraphs:
          - "Les objets vendus sont des biens d'occasion. Ils présentent les traces d'usage, patines et irrégularités propres à leur âge et à leur histoire ; ces caractéristiques ne constituent pas un défaut."
          - "Les descriptions, photographies, dimensions et indications d'état sont établies avec le plus grand soin, mais restent indicatives. Toute question peut être posée avant l'achat par e-mail, téléphone ou WhatsApp."
      - title: "4. Prix"
        paragraphs:
          - "Les prix sont indiqués en euros, toutes taxes comprises. Les frais de livraison ne sont pas compris dans le prix des objets ; ils sont affichés et acceptés avant le paiement."
          - "Le régime de TVA applicable (régime particulier de la marge pour biens d'occasion, le cas échéant) est mentionné sur la facture. Le vendeur se réserve le droit de modifier ses prix à tout moment ; les objets sont facturés au prix en vigueur au moment de la commande."
      - title: "5. Commande et paiement"
        paragraphs:
          - "La commande se fait via le panier du site. Pendant la procédure de paiement, les objets du panier sont réservés à l'acheteur pour une durée d'environ 30 minutes ; passé ce délai sans paiement, ils redeviennent disponibles."
          - "Le paiement est effectué en ligne, de manière sécurisée, via la plateforme Stripe (Bancontact, cartes de crédit et de débit). Le vendeur n'a jamais accès aux données bancaires de l'acheteur."
          - "Le contrat est conclu à la réception du paiement. Une confirmation de commande est envoyée par e-mail. Si, malgré les vérifications, un objet s'avérait indisponible, l'acheteur en est informé et intégralement remboursé dans les 14 jours."
      - title: "6. Livraison et retrait"
        paragraphs:
          - "La livraison est proposée en Belgique uniquement. Elle est confiée à un transporteur spécialisé dans le transport d'objets d'art et de mobilier. Les frais dépendent de l'encombrement des objets et sont calculés pour l'ensemble de la commande."
          - "L'acheteur peut également retirer sa commande gratuitement à l'atelier, sur rendez-vous, aux heures d'ouverture."
          - "Après le paiement, le vendeur contacte l'acheteur pour convenir des modalités et de la date de livraison ou de retrait. Le délai indicatif de livraison est de 5 à 15 jours ouvrables après cette prise de contact."
          - "Le risque de perte ou d'endommagement passe à l'acheteur au moment où il, ou un tiers désigné par lui, prend physiquement possession de l'objet. L'acheteur vérifie l'objet à la réception et signale tout dommage de transport dans les 48 heures, photographies à l'appui."
      - title: "7. Droit de rétractation"
        paragraphs:
          - "Conformément au Livre VI du Code de droit économique, l'acheteur consommateur dispose d'un délai de 14 jours calendrier à compter du jour où il, ou un tiers désigné par lui, prend physiquement possession de l'objet pour se rétracter, sans avoir à motiver sa décision."
          - "Pour exercer ce droit, l'acheteur notifie sa décision au vendeur par une déclaration dénuée d'ambiguïté (e-mail à ateliersauvageheusy@gmail.com ou courrier), par exemple au moyen du formulaire ci-dessous."
          - "L'acheteur renvoie ou rapporte l'objet au vendeur sans retard excessif et au plus tard 14 jours après la notification. Les frais directs de renvoi sont à la charge de l'acheteur. Pour les objets qui ne peuvent être renvoyés par la poste en raison de leur nature, ces frais correspondent au coût d'un transporteur spécialisé ; ils sont estimés au montant des frais de livraison de la commande."
          - "Le vendeur rembourse tous les paiements reçus, y compris les frais de livraison initiaux (à l'exception des frais supplémentaires découlant d'un mode de livraison autre que le mode le moins coûteux proposé), au plus tard 14 jours après avoir été informé de la rétractation. Le remboursement peut être différé jusqu'à la récupération de l'objet ou la fourniture d'une preuve de son expédition."
          - "L'acheteur est responsable de la dépréciation de l'objet résultant de manipulations autres que celles nécessaires pour en établir la nature, les caractéristiques et le bon fonctionnement."
      - title: "8. Garantie légale"
        paragraphs:
          - "Les objets d'occasion bénéficient de la garantie légale de conformité prévue par le Code civil. Conformément à la loi, cette garantie est fixée à un an à compter de la livraison pour les biens d'occasion."
          - "Ne sont pas couverts par la garantie les défauts et traces d'usage signalés dans la description ou visibles sur les photographies, ni l'usure normale, ni les dommages résultant d'une utilisation, d'un entretien ou d'un stockage inappropriés."
      - title: "9. Responsabilité"
        paragraphs:
          - "Le vendeur ne peut être tenu responsable de l'inexécution ou du retard d'exécution de ses obligations en cas de force majeure, ni des dommages indirects. La responsabilité du vendeur est en tout état de cause limitée au montant de la commande."
      - title: "10. Données personnelles"
        paragraphs:
          - "Les données collectées lors de la commande (identité, coordonnées, adresse de livraison) sont utilisées uniquement pour le traitement de la commande, la livraison et les obligations légales du vendeur. Elles sont transmises au prestataire de paiement (Stripe), au service d'envoi d'e-mails (Resend) et au transporteur, dans la mesure nécessaire. Voir également nos mentions légales."
      - title: "11. Droit applicable et litiges"
        paragraphs:
          - "Les présentes conditions sont soumises au droit belge. En cas de litige, les parties recherchent d'abord une solution amiable. Le consommateur peut s'adresser au Service de Médiation pour le Consommateur (mediationconsommateur.be) ou à la plateforme européenne de règlement en ligne des litiges (ec.europa.eu/consumers/odr). À défaut, les tribunaux de l'arrondissement de Liège, division Verviers, sont compétents, sans préjudice des règles impératives de compétence."
    form_title: "Modèle de formulaire de rétractation"
    form_intro: "À compléter et renvoyer uniquement si vous souhaitez vous rétracter du contrat."
    form_lines:
      - "À l'attention de HAMAPA SRL (Atelier Sauvage), Chaussée de Theux 59, 4802 Heusy — ateliersauvageheusy@gmail.com :"
