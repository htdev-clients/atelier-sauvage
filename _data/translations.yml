  cgv:
    page_title: "Terms and conditions of sale – Atelier Sauvage"
    page_description: "Atelier Sauvage online terms of sale: ordering, payment, delivery, right of withdrawal."
    heading: "Terms and conditions of sale"
    updated: "Version of 2 September 2026"
    intro: "These terms govern every distance sale made through ateliersauvageheusy.be. By placing an order, the buyer confirms having read and accepted them. The French version prevails in case of discrepancy."
    sections:
      - title: "1. Seller"
        paragraphs:
          - "HAMAPA SRL, trading as “Atelier Sauvage”, Chaussée de Theux 59, 4802 Heusy (Verviers), Belgium — company/VAT no. BE 1000.380.596 — ateliersauvageheusy@gmail.com — +32 495 29 22 25."
      - title: "2. Scope"
        paragraphs:
          - "These terms apply to the online sale of second-hand objects, vintage furniture and decorative pieces offered on the site to consumers residing in Belgium."
          - "Every piece is one of a kind. Stock is therefore one unit per reference, and a piece can only be sold once."
      - title: "3. Pieces, descriptions and condition"
        paragraphs:
          - "The pieces sold are second-hand goods. They show the marks of use, patina and irregularities that come with their age and history; these are not defects."
          - "Descriptions, photographs, dimensions and condition notes are prepared with great care but remain indicative. Questions are welcome before purchase by e-mail, phone or WhatsApp."
      - title: "4. Prices"
        paragraphs:
          - "Prices are in euros, all taxes included. Delivery costs are not included in the price of the pieces; they are shown and accepted before payment."
          - "The applicable VAT regime (margin scheme for second-hand goods, where relevant) is stated on the invoice. The seller may change prices at any time; pieces are invoiced at the price in force when the order is placed."
      - title: "5. Ordering and payment"
        paragraphs:
          - "Orders are placed through the site's cart. During the payment step, the pieces in the cart are reserved for the buyer for about 30 minutes; after that, without payment, they become available again."
          - "Payment is made online, securely, through the Stripe platform (Bancontact, credit and debit cards). The seller never has access to the buyer's banking details."
          - "The contract is concluded on receipt of payment. An order confirmation is sent by e-mail. If, despite our checks, a piece turns out to be unavailable, the buyer is informed and fully refunded within 14 days."
      - title: "6. Delivery and collection"
        paragraphs:
          - "Delivery is offered within Belgium only, by a carrier specialising in art and furniture. Costs depend on the size of the pieces and are calculated for the order as a whole."
          - "The buyer may also collect the order free of charge from the shop, by appointment, during opening hours."
          - "After payment, the seller contacts the buyer to agree on the arrangements and date of delivery or collection. Indicative delivery time is 5 to 15 working days after that contact."
          - "The risk of loss or damage passes to the buyer when the buyer, or a third party designated by the buyer, takes physical possession of the piece. The buyer checks the piece on receipt and reports any transport damage within 48 hours, with photographs."
      - title: "7. Right of withdrawal"
        paragraphs:
          - "Under Book VI of the Belgian Code of Economic Law, a consumer has 14 calendar days from the day on which they, or a third party designated by them, take physical possession of the piece to withdraw from the contract without giving any reason."
          - "To exercise this right, the buyer notifies the seller by an unequivocal statement (e-mail to ateliersauvageheusy@gmail.com or letter), for instance using the form below."
          - "The buyer returns or brings back the piece without undue delay and at the latest 14 days after the notification. The direct cost of returning the piece is borne by the buyer. For pieces that cannot normally be returned by post because of their nature, this cost is that of a specialist carrier; it is estimated at the amount of the order's delivery charge."
          - "The seller refunds all payments received, including the initial delivery costs (except any supplementary costs arising from a delivery option other than the least expensive one offered), no later than 14 days after being informed of the withdrawal. The refund may be withheld until the piece has been recovered or proof of its dispatch has been supplied."
          - "The buyer is liable for any diminished value of the piece resulting from handling other than what is necessary to establish its nature, characteristics and functioning."
      - title: "8. Legal guarantee"
        paragraphs:
          - "Second-hand pieces are covered by the legal guarantee of conformity under the Belgian Civil Code. As the law allows, this guarantee is set at one year from delivery for second-hand goods."
          - "The guarantee does not cover defects and marks of use stated in the description or visible in the photographs, normal wear, or damage resulting from inappropriate use, care or storage."
      - title: "9. Liability"
        paragraphs:
          - "The seller is not liable for non-performance or delay caused by force majeure, nor for indirect damage. The seller's liability is in any case limited to the amount of the order."
      - title: "10. Personal data"
        paragraphs:
          - "Data collected when ordering (identity, contact details, delivery address) is used only to process the order, deliver it and meet the seller's legal obligations. It is passed to the payment provider (Stripe), the e-mail service (Resend) and the carrier, as far as necessary. See also our legal notice."
      - title: "11. Governing law and disputes"
        paragraphs:
          - "These terms are governed by Belgian law. In the event of a dispute, the parties first seek an amicable solution. Consumers may contact the Belgian Consumer Mediation Service (consumerombudsman.be) or the European online dispute resolution platform (ec.europa.eu/consumers/odr). Failing that, the courts of the judicial district of Liège, Verviers division, have jurisdiction, without prejudice to mandatory rules of jurisdiction."
    form_title: "Model withdrawal form"
    form_intro: "Complete and return this form only if you wish to withdraw from the contract."
    form_lines:
      - "To HAMAPA SRL (Atelier Sauvage), Chaussée de Theux 59, 4802 Heusy, Belgium — ateliersauvageheusy@gmail.com:"
