  cgv:
    page_title: "Allgemeine Geschäftsbedingungen – Atelier Sauvage"
    page_description: "Allgemeine Geschäftsbedingungen für den Online-Verkauf bei Atelier Sauvage: Bestellung, Zahlung, Lieferung, Widerrufsrecht."
    heading: "Allgemeine Geschäftsbedingungen"
    updated: "Fassung vom 2. September 2026"
    intro: "Diese Bedingungen gelten für jeden Fernabsatzvertrag, der über ateliersauvageheusy.be geschlossen wird. Mit der Bestellung bestätigt der Käufer, sie gelesen und akzeptiert zu haben. Bei Abweichungen gilt die französische Fassung."
    sections:
      - title: "1. Verkäufer"
        paragraphs:
          - "HAMAPA SRL, Handelsname „Atelier Sauvage“, Chaussée de Theux 59, 4802 Heusy (Verviers), Belgien — Unternehmens-/MwSt.-Nr. BE 1000.380.596 — ateliersauvageheusy@gmail.com — +32 495 29 22 25."
      - title: "2. Geltungsbereich"
        paragraphs:
          - "Diese Bedingungen gelten für den Online-Verkauf von gebrauchten Objekten, Vintage-Möbeln und Dekorationsstücken, die auf der Website Verbrauchern mit Wohnsitz in Belgien angeboten werden."
          - "Jedes Objekt ist ein Unikat. Der Bestand beträgt daher ein Stück je Referenz, und ein Objekt kann nur einmal verkauft werden."
      - title: "3. Objekte, Beschreibungen und Zustand"
        paragraphs:
          - "Die verkauften Objekte sind Gebrauchtwaren. Sie weisen Gebrauchsspuren, Patina und Unregelmäßigkeiten auf, die zu ihrem Alter und ihrer Geschichte gehören; diese stellen keinen Mangel dar."
          - "Beschreibungen, Fotos, Maße und Zustandsangaben werden mit größter Sorgfalt erstellt, bleiben aber unverbindlich. Fragen sind vor dem Kauf per E-Mail, Telefon oder WhatsApp willkommen."
      - title: "4. Preise"
        paragraphs:
          - "Die Preise verstehen sich in Euro inklusive aller Steuern. Die Lieferkosten sind im Preis der Objekte nicht enthalten; sie werden vor der Zahlung angezeigt und akzeptiert."
          - "Die anwendbare Mehrwertsteuerregelung (gegebenenfalls Differenzbesteuerung für Gebrauchtwaren) wird auf der Rechnung angegeben. Der Verkäufer kann seine Preise jederzeit ändern; Objekte werden zum bei der Bestellung geltenden Preis in Rechnung gestellt."
      - title: "5. Bestellung und Zahlung"
        paragraphs:
          - "Die Bestellung erfolgt über den Warenkorb der Website. Während des Bezahlvorgangs werden die Objekte im Warenkorb für etwa 30 Minuten für den Käufer reserviert; danach werden sie ohne Zahlung wieder verfügbar."
          - "Die Zahlung erfolgt online und gesichert über die Plattform Stripe (Bancontact, Kredit- und Debitkarten). Der Verkäufer hat zu keinem Zeitpunkt Zugriff auf die Bankdaten des Käufers."
          - "Der Vertrag kommt mit Eingang der Zahlung zustande. Eine Bestellbestätigung wird per E-Mail versandt. Sollte sich ein Objekt trotz der Prüfungen als nicht verfügbar erweisen, wird der Käufer informiert und innerhalb von 14 Tagen vollständig erstattet."
      - title: "6. Lieferung und Abholung"
        paragraphs:
          - "Die Lieferung wird nur innerhalb Belgiens angeboten, durch eine auf Kunst und Möbel spezialisierte Spedition. Die Kosten hängen vom Umfang der Objekte ab und werden für die gesamte Bestellung berechnet."
          - "Der Käufer kann seine Bestellung auch kostenlos im Atelier abholen, nach Vereinbarung, während der Öffnungszeiten."
          - "Nach der Zahlung setzt sich der Verkäufer mit dem Käufer in Verbindung, um Modalitäten und Termin der Lieferung oder Abholung zu vereinbaren. Die voraussichtliche Lieferzeit beträgt 5 bis 15 Werktage nach dieser Kontaktaufnahme."
          - "Das Risiko des Verlusts oder der Beschädigung geht auf den Käufer über, sobald er oder ein von ihm benannter Dritter das Objekt physisch in Besitz nimmt. Der Käufer prüft das Objekt bei Erhalt und meldet Transportschäden innerhalb von 48 Stunden mit Fotos."
      - title: "7. Widerrufsrecht"
        paragraphs:
          - "Gemäß Buch VI des belgischen Wirtschaftsgesetzbuchs hat der Verbraucher das Recht, den Vertrag innerhalb von 14 Kalendertagen ab dem Tag, an dem er oder ein von ihm benannter Dritter das Objekt physisch in Besitz nimmt, ohne Angabe von Gründen zu widerrufen."
          - "Zur Ausübung dieses Rechts teilt der Käufer dem Verkäufer seinen Entschluss durch eine eindeutige Erklärung mit (E-Mail an ateliersauvageheusy@gmail.com oder Brief), zum Beispiel mit dem untenstehenden Formular."
          - "Der Käufer sendet das Objekt unverzüglich, spätestens 14 Tage nach der Mitteilung, zurück oder bringt es zurück. Die unmittelbaren Kosten der Rücksendung trägt der Käufer. Bei Objekten, die aufgrund ihrer Beschaffenheit nicht per Post zurückgesandt werden können, sind dies die Kosten einer Spezialspedition; sie werden auf die Höhe der Lieferkosten der Bestellung geschätzt."
          - "Der Verkäufer erstattet alle erhaltenen Zahlungen einschließlich der ursprünglichen Lieferkosten (mit Ausnahme zusätzlicher Kosten, die sich aus der Wahl einer anderen als der günstigsten angebotenen Lieferart ergeben) spätestens 14 Tage nach Eingang der Widerrufserklärung. Die Erstattung kann verweigert werden, bis das Objekt zurückerhalten oder ein Versandnachweis erbracht wurde."
          - "Der Käufer haftet für einen Wertverlust des Objekts, der auf einen Umgang zurückzuführen ist, der zur Prüfung von Beschaffenheit, Eigenschaften und Funktionsweise nicht notwendig war."
      - title: "8. Gesetzliche Gewährleistung"
        paragraphs:
          - "Gebrauchte Objekte unterliegen der gesetzlichen Gewährleistung für Vertragsmäßigkeit nach dem belgischen Zivilgesetzbuch. Wie gesetzlich zulässig, beträgt diese Gewährleistung für Gebrauchtwaren ein Jahr ab Lieferung."
          - "Nicht abgedeckt sind Mängel und Gebrauchsspuren, die in der Beschreibung genannt oder auf den Fotos sichtbar sind, normale Abnutzung sowie Schäden durch unsachgemäße Nutzung, Pflege oder Lagerung."
      - title: "9. Haftung"
        paragraphs:
          - "Der Verkäufer haftet nicht für die Nichterfüllung oder verspätete Erfüllung seiner Pflichten bei höherer Gewalt und nicht für mittelbare Schäden. Die Haftung des Verkäufers ist in jedem Fall auf den Bestellwert begrenzt."
      - title: "10. Personenbezogene Daten"
        paragraphs:
          - "Die bei der Bestellung erhobenen Daten (Identität, Kontaktdaten, Lieferadresse) werden ausschließlich zur Abwicklung der Bestellung, zur Lieferung und zur Erfüllung der gesetzlichen Pflichten des Verkäufers verwendet. Sie werden, soweit erforderlich, an den Zahlungsdienstleister (Stripe), den E-Mail-Dienst (Resend) und die Spedition weitergegeben. Siehe auch unser Impressum."
      - title: "11. Anwendbares Recht und Streitigkeiten"
        paragraphs:
          - "Diese Bedingungen unterliegen belgischem Recht. Im Streitfall suchen die Parteien zunächst eine gütliche Lösung. Verbraucher können sich an den belgischen Verbraucherombudsdienst (verbraucherombudsdienst.be) oder an die europäische Plattform zur Online-Streitbeilegung (ec.europa.eu/consumers/odr) wenden. Andernfalls sind die Gerichte des Bezirks Lüttich, Abteilung Verviers, zuständig, unbeschadet zwingender Zuständigkeitsregeln."
