name: Update Catalog

on:
  workflow_dispatch:

concurrency:
  group: catalog-update
  cancel-in-progress: false


permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          FOLDER_ID: ${{ vars.FOLDER_ID }}
        run: python scripts/update_catalog.py

      - name: Write timeout status
        if: cancelled()
        run: |
          printf '{"status": "failure", "message": "Le job a dépassé le délai imparti (timeout).", "timestamp": "%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" > scripts/.last_run.json

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ job.status }}" = "success" ]; then
            git add scripts/.last_run.json _database/catalog.csv _database/catalog_validation.json assets/img/catalog/
            MSG="catalog update [automated]"
          else
            git add scripts/.last_run.json
            MSG="catalog update status [automated] [skip ci]"
          fi
          if git diff --staged --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "$MSG"
            git pull --rebase origin main
            git push
          fi

  # Publish from CI. The Pages Git integration can disconnect without any
  # signal, so a catalog commit reaching main is not proof the site updated.
  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # If publishing failed, the catalog is updated but the site is not. Say so in
  # scripts/.last_run.json, which is what the Google Sheets popup reads —
  # otherwise the client sees a green "Succès" for a site that never changed.
  report-deploy-failure:
    needs: [update, deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record the failure
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("scripts/.last_run.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          data["status"] = "failure"
          data["message"] = (
              "Le catalogue a bien été mis à jour, mais le site n'a pas pu être "
              "publié. Les changements ne sont donc pas encore visibles en ligne. "
              "Prévenez Harold."
          )
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8")
          PY

      - name: Commit the status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/.last_run.json
          if git diff --staged --quiet; then
            echo "Status already recorded, nothing to commit."
          else
            git commit -m "deploy failure status [automated] [skip ci]"
            git pull --rebase origin main
            git push
          fi
