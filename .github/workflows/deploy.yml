name: Deploy

# Publishes the site from CI rather than relying on the Cloudflare Pages Git
# integration.
#
# Why: in July 2026 that integration silently disconnected. No build ran for 23
# days while the catalog Action, git and scripts/.last_run.json all stayed
# green, and the site quietly served a stale build. Nothing surfaced it except a
# human noticing the live site was wrong. Publishing here means a failed publish
# is a failed workflow run — visible in Actions, emailed, and (for catalog runs)
# reported back into the Google Sheets popup.

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Take the current tip of the branch, not the SHA that triggered the
          # caller. update_catalog.yml commits the catalog *after* it starts, so
          # its triggering SHA predates the change we need to publish.
          ref: ${{ github.ref_name }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      # Tailwind is not run here: assets/css/style.css is committed prebuilt,
      # because Cloudflare Pages does not run it either.
      - name: Sanity-check the build
        run: |
          test -f _site/index.html
          test -f _site/sitemap.xml
          pages=$(find _site -name '*.html' | wc -l)
          echo "built $pages html page(s)"
          # Four pages in four languages. Fewer means the build lost something.
          test "$pages" -ge 16

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}

      # The step above succeeding only means Cloudflare accepted the upload.
      # This confirms the public URL actually serves it, which is the failure
      # the whole workflow exists to catch.
      - name: Verify the live site serves this build
        if: github.ref_name == 'main'
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, time
          from datetime import datetime

          SITEMAP = "https://ateliersauvageheusy.be/sitemap.xml"
          # A health check on our own site. Cloudflare's bot protection rejects
          # obvious tool user-agents, so identify as an ordinary browser.
          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36")

          def fetch():
              """(status, body). Cache-busted: the edge caches assets for a week,
              so a bare request can answer from cache instead of the deployment."""
              proc = subprocess.run(
                  ["curl", "-sS", "--max-time", "20", "-A", UA, "-w", "\n%{http_code}",
                   f"{SITEMAP}?deploy-check={int(time.time())}"],
                  capture_output=True, text=True)
              if proc.returncode != 0:
                  return None, proc.stderr.strip()
              body, _, status = proc.stdout.rpartition("\n")
              return status.strip(), body

          built = re.search(r"<lastmod>([^<]*)",
                            open("_site/sitemap.xml", encoding="utf-8").read()).group(1)
          built_at = datetime.fromisoformat(built)
          print("this build:", built)

          reason = "no attempt completed"
          for attempt in range(1, 9):
              status, body = fetch()
              if status is None:
                  reason = f"curl failed: {body}"
              elif status != "200":
                  reason = f"HTTP {status}"
              else:
                  found = re.search(r"<lastmod>([^<]*)", body)
                  if not found:
                      reason = "200, but no <lastmod> in the response"
                  else:
                      live = found.group(1)
                      print(f"attempt {attempt} - live: {live}")
                      # Compare instants, not strings: a CI build stamps +00:00
                      # and a local one +02:00.
                      if datetime.fromisoformat(live) >= built_at:
                          print("Live site is serving this build or newer.")
                          sys.exit(0)
                      reason = f"live site is serving an older build ({live})"
              print(f"attempt {attempt} - {reason}")
              time.sleep(20)

          print("::error::Cloudflare accepted the deploy, but verifying "
                f"https://ateliersauvageheusy.be/ failed: {reason}")
          sys.exit(1)
          PY
