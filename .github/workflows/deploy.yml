name: Deploy

# Publishes the site from CI rather than relying on the Cloudflare Pages Git
# integration.
#
# Why: in July 2026 that integration silently disconnected. No build ran for 23
# days while the catalog Action, git and scripts/.last_run.json all stayed
# green, and the site quietly served a stale build. Nothing surfaced it except a
# human noticing the live site was wrong. Publishing here means a failed publish
# is a failed workflow run — visible in Actions, emailed, and (for catalog runs)
# reported back into the Google Sheets popup.

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      test_fixtures:
        description: >-
          Preview only: give a dozen sellable items placeholder transport
          bands so the shop can be exercised. Refused on main.
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Take the current tip of the branch, not the SHA that triggered the
          # caller. update_catalog.yml commits the catalog *after* it starts, so
          # its triggering SHA predates the change we need to publish.
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install wrangler
        run: npm ci

      # The shop's Functions run against a local D1 here: the concurrency test
      # races checkouts for the same item and proves exactly one wins. A red
      # run means the ledger changed in a way that could sell an item twice.
      - name: Test the shop Functions
        run: npm test

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      # Never on main: these bands are placeholders, and on the live site they
      # would make a dozen items buyable with made-up shipping.
      - name: Add shop test fixtures (preview only)
        if: github.ref_name != 'main' && inputs.test_fixtures == true
        run: python3 scripts/apply_test_fixtures.py

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      # Tailwind is not run here: assets/css/style.css is committed prebuilt,
      # because Cloudflare Pages does not run it either.
      - name: Sanity-check the build
        run: |
          test -f _site/index.html
          test -f _site/sitemap.xml
          pages=$(find _site -name '*.html' | wc -l)
          echo "built $pages html page(s)"
          # Four pages in four languages. Fewer means the build lost something.
          test "$pages" -ge 16

      # Function secrets live on the Pages project, per environment. They are
      # pushed from GitHub secrets so that there is one place to set them and
      # the values never touch the dashboard, a laptop or this repo. Only the
      # names present as GitHub secrets are written; the rest are untouched.
      #
      #   preview    <- PREVIEW_STRIPE_SECRET_KEY, PREVIEW_STRIPE_WEBHOOK_SECRET,
      #                 PREVIEW_RESEND_API_KEY, PREVIEW_RECONCILE_TOKEN
      #   production <- PROD_STRIPE_SECRET_KEY, PROD_STRIPE_WEBHOOK_SECRET,
      #                 PROD_RESEND_API_KEY, PROD_RECONCILE_TOKEN
      #
      # Must run before the publish step: a deployment picks up the project's
      # variables at creation time.
      - name: Sync Function secrets to the Pages environment
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          PREVIEW_STRIPE_SECRET_KEY: ${{ secrets.PREVIEW_STRIPE_SECRET_KEY }}
          PREVIEW_STRIPE_WEBHOOK_SECRET: ${{ secrets.PREVIEW_STRIPE_WEBHOOK_SECRET }}
          PREVIEW_RESEND_API_KEY: ${{ secrets.PREVIEW_RESEND_API_KEY }}
          PREVIEW_RECONCILE_TOKEN: ${{ secrets.PREVIEW_RECONCILE_TOKEN }}
          PROD_STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          PROD_STRIPE_WEBHOOK_SECRET: ${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
          PROD_RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
          PROD_RECONCILE_TOKEN: ${{ secrets.PROD_RECONCILE_TOKEN }}
        run: python3 scripts/sync_pages_secrets.py

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}

      # Publishing only means Cloudflare accepted the upload. This confirms the
      # upload is also the deployment production actually serves.
      #
      # It deliberately does not fetch ateliersauvageheusy.be: Cloudflare's bot
      # protection returns 403 to this runner's datacenter IP regardless of
      # user-agent. So it checks the two things it still can -- that the
      # artifact is correct, and that Cloudflare considers it the canonical
      # production deployment -- which together cover the failure this workflow
      # exists to catch. What it cannot see is the custom domain itself.
      - name: Verify this deploy is live in production
        if: github.ref_name == 'main'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time
          from datetime import datetime, timezone

          deploy_url = (os.environ.get("DEPLOY_URL") or "").rstrip("/")
          project    = os.environ["CF_PROJECT"]
          account    = os.environ["CF_ACCOUNT_ID"]
          token      = os.environ["CF_API_TOKEN"]

          def curl(url, *args):
              proc = subprocess.run(
                  ["curl", "-sS", "--max-time", "20", "-w", "\n%{http_code}", *args, url],
                  capture_output=True, text=True)
              if proc.returncode != 0:
                  return None, proc.stderr.strip()
              body, _, status = proc.stdout.rpartition("\n")
              return status.strip(), body

          built = re.search(r"<lastmod>([^<]*)",
                            open("_site/sitemap.xml", encoding="utf-8").read()).group(1)
          built_at = datetime.fromisoformat(built)
          print("this build:", built)
          print("deployment :", deploy_url or "<not reported by wrangler-action>")

          # 1. The uploaded artifact is the one we just built.
          if deploy_url:
              reason = "no attempt completed"
              for attempt in range(1, 5):
                  status, body = curl(f"{deploy_url}/sitemap.xml")
                  if status != "200":
                      reason = f"HTTP {status}" if status else f"curl failed: {body}"
                  else:
                      found = re.search(r"<lastmod>([^<]*)", body)
                      if not found:
                          reason = "200, but no <lastmod> in the response"
                      elif datetime.fromisoformat(found.group(1)) >= built_at:
                          print(f"artifact OK - deployment serves {found.group(1)}")
                          reason = None
                          break
                      else:
                          reason = f"deployment serves an older build ({found.group(1)})"
                  print(f"  attempt {attempt} - {reason}")
                  time.sleep(10)
              if reason:
                  print(f"::error::The deployment does not serve this build: {reason}")
                  sys.exit(1)

          # 2. Cloudflare serves that deployment as production.
          status, body = curl(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}",
              "-H", f"Authorization: Bearer {token}")
          if status != "200":
              print(f"::error::Could not read the Pages project from the API: "
                    f"{status or 'curl failed'} {body[:300]}")
              sys.exit(1)

          canonical = (json.loads(body).get("result") or {}).get("canonical_deployment") or {}
          live_url  = (canonical.get("url") or "").rstrip("/")
          created   = canonical.get("created_on", "?")
          print(f"production : {live_url or '<none>'} (created {created})")

          if deploy_url and live_url != deploy_url:
              print("::error::Cloudflare accepted the upload, but production is still "
                    f"serving {live_url or 'nothing'} rather than {deploy_url}. The deploy "
                    "may have landed on a preview branch instead of production.")
              sys.exit(1)

          print("Live in production.")
          PY
